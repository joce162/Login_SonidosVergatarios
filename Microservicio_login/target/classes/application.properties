spring.application.name=login
server.port=8081

# Perfil de base de datos: h2 (por defecto, archivo local) o mysql.
# Para MySQL:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
spring.profiles.active=h2

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- JWT (el MISMO secreto debe usarse en login, productos y carrito) ---
app.jwt.secret=${JWT_SECRET:sv-clave-demo-solo-desarrollo-cambiar-en-produccion-123456}
app.jwt.issuer=sonidos-vergatarios
app.jwt.access-minutes=15
app.jwt.refresh-days=7

# Cookie de renovación (HttpOnly). En HTTPS poner COOKIE_SECURE=true.
app.cookie.secure=${COOKIE_SECURE:false}
# Valor exigido en la cabecera X-Requested-With para refresh/logout.
app.csrf-header=SonidosVergatarios

# Datos iniciales (solo desarrollo)
app.seed.admin-password=${ADMIN_PASSWORD:Admin1234}
app.seed.demo=${SEED_DEMO:true}

# Swagger / OpenAPI
app.public-url=${PUBLIC_URL:http://localhost:8080}
springdoc.swagger-ui.path=/swagger-ui.html
